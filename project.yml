name: Milkit
options:
  bundleIdPrefix: io.github.stankela16
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.2"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Milkit:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Sounds
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stankela16.milkit
        PRODUCT_NAME: Milkit
        PRODUCT_MODULE_NAME: Milkit
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - "-lsqlite3"
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
    scheme:
      testTargets:
        - MilkitTests

  MilkitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Milkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stankela16.milkit.tests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS:
          - "-lsqlite3"
