<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Crisp monochrome template Pixel Cow for macOS Menu Bar (10x8 voxel grid) -->
  <g fill="#000000">
    <!-- Horns (row 0) -->
    <rect x="6" y="4" width="2" height="2" rx="0.4"/>
    <rect x="16" y="4" width="2" height="2" rx="0.4"/>
    <!-- Ears + Crown (row 1) -->
    <rect x="2" y="6" width="20" height="2" rx="0.5"/>
    <!-- Forehead (row 2) -->
    <rect x="6" y="8" width="12" height="2" rx="0.4"/>
    <!-- Eyes row (row 3: cutouts at x=8 and x=14) -->
    <rect x="6" y="10" width="2" height="2" rx="0.3"/>
    <rect x="10" y="10" width="4" height="2" rx="0.3"/>
    <rect x="16" y="10" width="2" height="2" rx="0.3"/>
    <!-- Cheeks (row 4) -->
    <rect x="6" y="12" width="12" height="2" rx="0.4"/>
    <!-- Snout top (row 5) -->
    <rect x="4" y="14" width="16" height="2" rx="0.5"/>
    <!-- Snout mid with nostrils cutouts at x=8 and x=14 (row 6) -->
    <rect x="4" y="16" width="4" height="2" rx="0.3"/>
    <rect x="10" y="16" width="4" height="2" rx="0.3"/>
    <rect x="16" y="16" width="4" height="2" rx="0.3"/>
    <!-- Chin (row 7) -->
    <rect x="6" y="18" width="12" height="2" rx="0.5"/>
  </g>
</svg>
